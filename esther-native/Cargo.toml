[package]
name = "esther-native"
version = "0.3.0"
edition = "2021"
description = "Esther's cards (header, calendar, This week, Tasks) as a native program: how light Esther can be without Electron."
license = "MIT"
publish = false

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-software", "renderer-femtovg", "compat-1-2", "raw-window-handle-06", "unstable-winit-030"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["local-offset", "formatting", "parsing", "macros"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_ProcessStatus",
  "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_HiDpi",
  "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_LibraryLoader",
] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Slint's software renderer, with letters drawn the way Windows draws them (hinted, with Windows' gamma and contrast):
# see vendor/i-slint-renderer-software/ESTHER.md.
[patch.crates-io]
i-slint-renderer-software = { path = "vendor/i-slint-renderer-software" }
