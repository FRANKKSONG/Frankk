# Builds native Esther (Rust + Slint: the header, calendar, This week and Tasks cards) for Windows, uses it on the test
# machine with the real mouse and keyboard, and puts the program, pictures of the cards and its memory use on the
# "Esther native" pre-release.
name: Esther native (Windows)

on:
  push:
    branches: [claude/new-session-ynjv6z]
    paths: ['esther-native/**', '.github/workflows/esther-native.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esther-native
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: esther-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            esther-native/target
          key: esther-native-${{ runner.os }}-${{ hashFiles('esther-native/Cargo.toml', 'esther-native/Cargo.lock') }}
      - name: Build
        run: cargo build --release
      - name: Try it (smoke test)
        run: |
          mkdir -p smoke && cp tests/fixture/tasks.json smoke/
          export ESTHER_TODAY=2026-10-21 ESTHER_WALLPAPER="$(cygpath -w "$PWD/tests/fixture/wall.png")"
          timeout 90 ./target/release/esther-native.exe --smoke "$(cygpath -w "$PWD/smoke")"
          echo "exe size: $(stat -c %s target/release/esther-native.exe) bytes"
          cat smoke/memory.json; echo
          node -e "
            const m = require('./smoke/memory.json');
            const fail = [];
            if (!m.real_input) fail.push('the windows never became Windows windows (no real input)');
            if (m.windows !== 4) fail.push('expected 4 card windows, got ' + m.windows);
            for (const [k, c] of Object.entries(m.cards)) {
              if (!c.screenshot) fail.push(k + ': no screenshot');
              if (!c.rounded_corners_asked) fail.push(k + ': rounded corners were not asked of Windows');
              if (!c.tool_window) fail.push(k + ': not a tool window (it would have a taskbar button)');
              if (!c.on_the_desktop) fail.push(k + ': not attached to the desktop window');
            }
            if (!(m.resized_px <= -40)) fail.push('dragging the Tasks card\'s right edge 72 px inwards resized it by ' + m.resized_px + ' px');
            if (!(m.moved_px >= 30)) fail.push('dragging the Tasks card moved it by ' + m.moved_px + ' px');
            if (!(m.header_moved_px >= 24)) fail.push('dragging the header moved it by ' + m.header_moved_px + ' px');
            if (!m.typed_task_saved) fail.push('a task typed with the keyboard and Enter was not saved');
            if (m.rows_before_day !== 6) fail.push('expected 6 tasks before picking a day, got ' + m.rows_before_day);
            if (m.rows_on_the_23rd !== 1) fail.push('picking the 23rd on the calendar should leave 1 task on the Tasks card, got ' + m.rows_on_the_23rd);
            if (m.rows_after_day !== 6) fail.push('picking the 23rd again should show every day (6 tasks), got ' + m.rows_after_day);
            if (m.pointed_out !== 't3') fail.push('clicking Buy dog food in This week should point it out on the Tasks card, got ' + JSON.stringify(m.pointed_out));
            if (!m.ticked_in_week_done_in_tasks) fail.push('ticking a task in This week did not show it done on the Tasks card');
            if (!m.ticked_task_saved) fail.push('ticking a task in This week was not saved');
            if (m.header_line !== 'Stillness, too, is a labour.') fail.push('the header\'s line for 21 Oct differs from the app\'s: ' + m.header_line);
            if (m.private_mb > 40) fail.push('private memory ' + m.private_mb + ' MB is over 40 MB');
            console.log(fail.length ? 'FAIL: ' + fail.join('; ') : 'PASS: 4 cards, ' + m.private_mb + ' MB private, ' + m.working_set_mb + ' MB working set');
            process.exit(fail.length ? 1 : 0);"
      - name: Publish to the "Esther native" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (esther-tasks.exe: the same program under the one-card prototype's name, which the Esther installer
          # build picks up for its "native preview" shortcut.)
          cp target/release/esther-native.exe smoke/esther-tasks.exe
          gh release delete esther-native --yes --cleanup-tag || true
          gh release create esther-native target/release/esther-native.exe smoke/esther-tasks.exe \
            smoke/header.png smoke/tasks-card.png smoke/calendar.png smoke/week.png smoke/memory.json \
            --target "$GITHUB_SHA" --prerelease \
            --title "Esther native (preview): all four cards" \
            --notes "Esther's header, calendar, This week and Tasks cards as one native Windows program (Rust + Slint), each card its own window on the desktop. It shares tasks with Esther through %APPDATA%\\Esther\\tasks.json (Esther 2.2 or later writes that file). Just run esther-native.exe; nothing is installed. Right-click the header and choose Quit Esther to close it. Not in it yet: the tray, the shortcut, starting with Windows, the bubble and Settings."
