# Builds native Esther (Rust + Slint: the header, calendar, This week and Tasks cards) for Windows, uses it on the test
# machine with the real mouse and keyboard, and puts the program, pictures of the cards and its memory use on the
# "Esther native" pre-release.
name: Esther native (Windows)

on:
  push:
    branches: [claude/new-session-ynjv6z]
    paths: ['esther-native/**', '.github/workflows/esther-native.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esther-native
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: esther-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            esther-native/target
          key: esther-native-${{ runner.os }}-${{ hashFiles('esther-native/Cargo.toml', 'esther-native/Cargo.lock') }}
      - name: Build
        run: cargo build --release
      - name: Try it (smoke test)
        run: |
          # (Windows' transparency effects on, as on a desktop PC: the test machine may come with them off.)
          reg add 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' //v EnableTransparency //t REG_DWORD //d 1 //f || true
          mkdir -p smoke && cp tests/fixture/tasks.json smoke/
          export ESTHER_TODAY=2026-10-21 ESTHER_WALLPAPER="$(cygpath -w "$PWD/tests/fixture/wall.png")"
          timeout 150 ./target/release/esther-native.exe --smoke "$(cygpath -w "$PWD/smoke")"
          echo "exe size: $(stat -c %s target/release/esther-native.exe) bytes"
          cat smoke/memory.json; echo
          node -e "
            const m = require('./smoke/memory.json');
            const fail = [], note = [];
            const want = (ok, what) => { if (!ok) fail.push(what); };
            want(m.real_input, 'the windows never became Windows windows (no real input)');
            want(m.windows === 5, 'expected 4 cards and the bubble, got ' + m.windows + ' windows');
            for (const [k, c] of Object.entries(m.cards)) {
              want(c.screenshot, k + ': no picture');
              want(c.rounded_corners_asked, k + ': rounded corners were not asked of Windows');
              want(c.tool_window, k + ': not a tool window (it would have a taskbar button)');
              want(c.on_the_desktop, k + ': not attached to the desktop window');
            }
            // Editing, with the real mouse and keyboard
            want(m.typed_task_saved, 'a task typed into Add a task (Enter) was not saved');
            want(m.renamed_by_click, 'clicking a task name and typing over it did not rename it');
            want(m.list_after_pill_menu && m.list_after_pill_menu !== 'general', 'picking another list from the list pill menu left the list as ' + JSON.stringify(m.list_after_pill_menu));
            want(m.subtask_added, 'clicking the subtasks column and typing did not add a subtask');
            want(m.date_from_picker_quick === '2026-10-22', 'the date picker Tomorrow gave ' + JSON.stringify(m.date_from_picker_quick));
            want(m.date_from_picker_day === '2026-10-25', 'the date picker 25th gave ' + JSON.stringify(m.date_from_picker_day));
            want(m.subtasks_closed_by_click, 'clicking the subtasks column again did not close them');
            want(m.list_renamed === 'Everyday', 'double-clicking a list tab and typing gave ' + JSON.stringify(m.list_renamed));
            want(m.list_added === 'Errands', 'the + for a new list gave ' + JSON.stringify(m.list_added));
            // The cards together
            want(m.rows_before_day === 6, 'expected 6 tasks before picking a day, got ' + m.rows_before_day);
            want(m.rows_on_the_23rd === 1, 'picking the 23rd on the calendar should leave 1 task on the Tasks card, got ' + m.rows_on_the_23rd);
            want(m.rows_after_day === 6, 'picking the 23rd again should show every day (6 tasks), got ' + m.rows_after_day);
            want(m.pointed_out === 't3', 'clicking Buy dog food in This week should point it out on the Tasks card, got ' + JSON.stringify(m.pointed_out));
            want(m.ticked_in_week_done_in_tasks, 'ticking a task in This week did not show it done on the Tasks card');
            want(m.ticked_task_saved, 'ticking a task in This week was not saved');
            want(m.header_line === 'Stillness, too, is a labour.', 'the header line for 21 Oct differs from the app: ' + m.header_line);
            // Moving and resizing, the grid and the guides
            want(m.resized_px <= -40, 'dragging the Tasks card right edge 72 px inwards resized it by ' + m.resized_px + ' px');
            want(m.moved_px >= 30, 'dragging the Tasks card moved it by ' + m.moved_px + ' px');
            want(m.header_moved_px >= 24, 'dragging the header moved it by ' + m.header_moved_px + ' px');
            want(m.guides_while_resizing, 'the grid and guides did not show while resizing');
            want(m.guides_while_moving, 'the grid and guides did not show while moving');
            want(m.guides_hidden_after, 'the guides stayed after letting go');
            want((m.lit_while_centring || []).includes('Centre'), 'the Centre guide did not light up near the screen centre: ' + JSON.stringify(m.lit_while_centring));
            want(Math.abs(m.centre_off_by_px) <= 1, 'the card did not snap to the screen centre (off by ' + m.centre_off_by_px + ' px)');
            // Hiding and showing
            want(m.shortcut_registered, 'Ctrl+Alt+E could not be registered');
            want(m.shortcut_hid_cards, 'Ctrl+Alt+E did not hide the cards');
            want(m.bubble_in_the_middle, 'the bubble did not move to the middle of the screen');
            want(m.bubble_showed_cards, 'clicking the bubble did not bring the cards back');
            want(m.bubble_in_the_corner, 'the bubble did not go back to the bottom left');
            if (m.tray_icon_rect) {
              want(m.tray_menu_opened, 'right-clicking the tray icon did not open its menu');
              want(m.tray_menu_closed_by_clicking_elsewhere, 'the tray menu stayed open after clicking elsewhere');
              want(m.tray_click_hid, 'clicking the tray icon did not hide the cards');
              want(m.tray_click_showed, 'clicking the tray icon again did not show the cards');
            } else note.push('the tray icon is in the overflow on this machine, so it was not clicked');
            want(m.startup_on && m.startup_off, 'Start with Windows did not write and remove its registry value');
            want(m.private_mb <= 40, 'private memory ' + m.private_mb + ' MB is over 40 MB');
            want(m.task_manager_mb <= 25, 'Task Manager would show ' + m.task_manager_mb + ' MB, over the 25 MB Esther keeps to');
            want(m.tasks_content_contrast >= 15, 'the Tasks card looks blank on the screen (brightness spread ' + m.tasks_content_contrast + ')');
            want(m.header_contrast_flying >= 10, 'the header flies out of the bubble blank (brightness spread ' + m.header_contrast_flying + ')');
            note.push('glass: ' + Object.entries(m.cards).map(([k, c]) => k + ' ' + c.glass).join(', '));
            note.push('the Tasks card takes ' + m.tasks_card_draw_ms + ' ms to draw whole');
            note.push('Task Manager would show ' + m.task_manager_mb + ' MB (private working set), after the whole test');
            for (const n of note) console.log('NOTE: ' + n);
            console.log(fail.length ? 'FAIL:\n  ' + fail.join('\n  ') : 'PASS: Task Manager ' + m.task_manager_mb + ' MB; ' + m.private_mb + ' MB private, ' + m.working_set_mb + ' MB working set');
            process.exit(fail.length ? 1 : 0);"
      - name: Keep the test's pictures (also when it fails)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete esther-native-test --yes --cleanup-tag || true
          files=$(ls smoke/*.png smoke/memory.json smoke/esther-native-log.txt 2>/dev/null || true)
          [ -n "$files" ] && gh release create esther-native-test $files \
            --target "$GITHUB_SHA" --prerelease --title "Esther native: the last test run's pictures" \
            --notes "What the Windows test machine saw on its last run (for checking; not a download)." || true
      - name: Publish to the "Esther native" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (esther-tasks.exe: the same program under the one-card prototype's name, which the Esther installer
          # build picks up for its "native preview" shortcut.)
          cp target/release/esther-native.exe smoke/esther-tasks.exe
          gh release delete esther-native --yes --cleanup-tag || true
          gh release create esther-native target/release/esther-native.exe smoke/esther-tasks.exe smoke/*.png smoke/memory.json \
            --target "$GITHUB_SHA" --prerelease \
            --title "Esther native (preview)" \
            --notes "Esther's header, calendar, This week and Tasks cards as one native Windows program (Rust + Slint), each card its own window on the desktop. It shares tasks with Esther through %APPDATA%\\Esther\\tasks.json (Esther 2.2 or later writes that file). Just run esther-native.exe; nothing is installed. Ctrl+Alt+E or the tray icon shows and hides it; Quit is in the tray menu. Not in it yet: Settings."
