# Builds native Esther (Rust + Slint: the header, calendar, This week and Tasks cards) for Windows, uses it on the test
# machine with the real mouse and keyboard, and puts the program, pictures of the cards and its memory use on the
# "Esther native" pre-release.
name: Esther native (Windows)

on:
  push:
    branches: [claude/new-session-ynjv6z]
    paths: ['esther-native/**', '.github/workflows/esther-native.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esther-native
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: esther-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            esther-native/target
          key: esther-native-${{ runner.os }}-${{ hashFiles('esther-native/Cargo.toml', 'esther-native/Cargo.lock') }}
          # (A new version changes Cargo.lock: start from the last build anyway, so only what changed is built again.)
          restore-keys: esther-native-${{ runner.os }}-
      - name: Build
        run: cargo build --release
      - name: Try it (smoke test)
        run: |
          # (Windows' transparency effects on, as on a desktop PC: the test machine may come with them off.)
          reg add 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' //v EnableTransparency //t REG_DWORD //d 1 //f || true
          mkdir -p smoke && cp tests/fixture/tasks.json smoke/
          export ESTHER_TODAY=2026-10-21 ESTHER_WALLPAPER="$(cygpath -w "$PWD/tests/fixture/wall.png")"
          timeout 150 ./target/release/esther-native.exe --smoke "$(cygpath -w "$PWD/smoke")"
          echo "exe size: $(stat -c %s target/release/esther-native.exe) bytes"
          # The version Windows shows in the program's Properties → Details.
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          shown=$(powershell.exe -NoProfile -Command "(Get-Item target/release/esther-native.exe).VersionInfo.ProductVersion" | tr -d '\r')
          echo "version in the program: $shown (Cargo.toml: $v)"
          case "$shown" in "$v"*) ;; *) echo "FAIL: the program does not carry its version"; exit 1;; esac
          cat smoke/memory.json; echo
          node -e "
            const m = require('./smoke/memory.json');
            const fail = [], note = [];
            const want = (ok, what) => { if (!ok) fail.push(what); };
            want(m.real_input, 'the windows never became Windows windows (no real input)');
            want(m.windows === 6, 'expected 4 cards, the bubble and Settings, got ' + m.windows + ' windows');
            for (const [k, c] of Object.entries(m.cards)) {
              want(c.screenshot, k + ': no picture');
              want(c.corners_as_meant, k + ': Windows was not asked for its corners (rounded cards, a bare bubble)');
              want(c.tool_window, k + ': not a tool window (it would have a taskbar button)');
              want(c.on_the_desktop, k + ': not attached to the desktop window');
            }
            // Editing, with the real mouse and keyboard
            want(m.typed_task_saved, 'a task typed into Add a task (Enter) was not saved');
            want(m.renamed_by_click, 'clicking a task name and typing over it did not rename it');
            want(m.list_after_pill_menu && m.list_after_pill_menu !== 'general', 'picking another list from the list pill menu left the list as ' + JSON.stringify(m.list_after_pill_menu));
            want(m.subtask_added, 'clicking the subtasks column and typing did not add a subtask');
            want(m.date_from_picker_quick === '2026-10-22', 'the date picker Tomorrow gave ' + JSON.stringify(m.date_from_picker_quick));
            want(m.date_from_picker_day === '2026-10-25', 'the date picker 25th gave ' + JSON.stringify(m.date_from_picker_day));
            want(m.subtasks_closed_by_click, 'clicking the subtasks column again did not close them');
            want(m.list_renamed === 'Everyday', 'double-clicking a list tab and typing gave ' + JSON.stringify(m.list_renamed));
            want(m.list_added === 'Errands', 'the + for a new list gave ' + JSON.stringify(m.list_added));
            // Settings
            want(m.settings_open, 'the gear on the header did not open Settings');
            want(m.look_picked === 'modern', 'clicking Modern in Settings, Look gave ' + JSON.stringify(m.look_picked));
            want(m.header_off_from_settings && m.header_on_again, 'the Header switch in Settings, Cards did not turn the header off and on');
            want(m.recording_keys, 'clicking the shortcut in Settings did not start picking new keys');
            want(m.shortcut_changed_to === 'Ctrl+Alt+K', 'pressing Ctrl+Alt+K in Settings gave ' + JSON.stringify(m.shortcut_changed_to) + ' (' + m.shortcut_note + ')');
            want(m.shortcut_back_to === 'Ctrl+Alt+E', 'changing the shortcut back gave ' + JSON.stringify(m.shortcut_back_to));
            want(m.settings_closed, 'the × on Settings did not close it');
            // The table
            want(m.task_menu_open, 'right-clicking a task did not open its menu');
            want(m.deleted_by_right_click, 'right-click, Delete task did not delete it');
            want(m.undo_brought_it_back, 'Ctrl+Z did not bring the deleted task back');
            want(m.sorted_by === 'date' && m.dates_in_order, 'clicking DATE did not sort by date (' + JSON.stringify(m.sorted_by) + ')');
            want(m.task_dragged_below_next, 'dragging a task by its grip did not move it below the next');
            want(m.tab_dragged, 'dragging a list tab did not move it (' + JSON.stringify(m.tab_order) + ')');
            want(m.list_column_after > m.list_column_before + 20 && m.columns_saved === m.list_column_after, 'dragging the LIST heading edge gave ' + m.list_column_before + ' -> ' + m.list_column_after + ' (saved ' + m.columns_saved + ')');
            // The cards together
            want(m.rows_before_day === 6, 'expected 6 tasks before picking a day, got ' + m.rows_before_day);
            want(m.rows_on_the_23rd === 1, 'picking the 23rd on the calendar should leave 1 task on the Tasks card, got ' + m.rows_on_the_23rd);
            want(m.rows_after_day === 6, 'picking the 23rd again should show every day (6 tasks), got ' + m.rows_after_day);
            want(m.pointed_out === 't3', 'clicking Buy dog food in This week should point it out on the Tasks card, got ' + JSON.stringify(m.pointed_out));
            want(m.ticked_in_week_done_in_tasks, 'ticking a task in This week did not show it done on the Tasks card');
            want(m.ticked_task_saved, 'ticking a task in This week was not saved');
            want(m.header_line === 'Stillness, too, is a labour.', 'the header line for 21 Oct differs from the app: ' + m.header_line);
            // Moving and resizing, the grid and the guides
            want(m.resized_px <= -40, 'dragging the Tasks card right edge 72 px inwards resized it by ' + m.resized_px + ' px');
            want(m.moved_px >= 30, 'dragging the Tasks card moved it by ' + m.moved_px + ' px');
            want(m.header_moved_px >= 24, 'dragging the header moved it by ' + m.header_moved_px + ' px');
            want(m.guides_while_resizing, 'the grid and guides did not show while resizing');
            want(m.guides_while_moving, 'the grid and guides did not show while moving');
            want(m.guides_hidden_after, 'the guides stayed after letting go');
            want((m.lit_while_centring || []).includes('Centre'), 'the Centre guide did not light up near the screen centre: ' + JSON.stringify(m.lit_while_centring));
            want(Math.abs(m.centre_off_by_px) <= 1, 'the card did not snap to the screen centre (off by ' + m.centre_off_by_px + ' px)');
            // Hiding and showing
            want(m.shortcut_registered, 'Ctrl+Alt+E could not be registered');
            want(m.shortcut_hid_cards, 'Ctrl+Alt+E did not hide the cards');
            want(m.bubble_in_the_middle, 'the bubble did not move to the middle of the screen');
            want(m.bubble_showed_cards, 'clicking the bubble did not bring the cards back');
            want(m.bubble_in_the_corner, 'the bubble did not go back to the bottom left');
            want(m.bubble_dragged_px && m.bubble_dragged_px[0] > 80 && m.bubble_dragged_px[1] < -40, 'dragging the bubble moved it by ' + JSON.stringify(m.bubble_dragged_px));
            want(m.bubble_drag_kept_cards, 'letting go of the dragged bubble hid the cards (it counted as a click)');
            want(m.bubble_place_saved, 'where the bubble was dragged to was not remembered');
            if (m.tray_icon_rect) {
              want(m.tray_menu_opened, 'right-clicking the tray icon did not open its menu');
              want(m.tray_menu_closed_by_clicking_elsewhere, 'the tray menu stayed open after clicking elsewhere');
              want(m.tray_click_hid, 'clicking the tray icon did not hide the cards');
              want(m.tray_click_showed, 'clicking the tray icon again did not show the cards');
            } else note.push('the tray icon is in the overflow on this machine, so it was not clicked');
            want(m.startup_on && m.startup_off, 'Start with Windows did not write and remove its registry value');
            want(m.private_mb <= 40, 'private memory ' + m.private_mb + ' MB is over 40 MB');
            want(m.task_manager_mb <= 25, 'Task Manager would show ' + m.task_manager_mb + ' MB, over the 25 MB Esther keeps to');
            want(m.tasks_content_contrast >= 15, 'the Tasks card looks blank on the screen (brightness spread ' + m.tasks_content_contrast + ')');
            want(m.header_contrast_flying >= 10, 'the header flies out of the bubble blank (brightness spread ' + m.header_contrast_flying + ')');
            note.push('glass: ' + Object.entries(m.cards).map(([k, c]) => k + ' ' + c.glass).join(', '));
            note.push('corners on the screen (very corner / inside): ' + Object.entries(m.cards).map(([k, c]) => k + ' ' + JSON.stringify(c.corner_on_screen)).join(', '));
            note.push('the Tasks card takes ' + m.tasks_card_draw_ms + ' ms to draw whole');
            note.push('Task Manager would show ' + m.task_manager_mb + ' MB (private working set), after the whole test');
            note.push('the cards were ready ' + m.ready_ms + ' ms after starting');
            want(m.ready_ms > 0 && m.ready_ms < 4000, 'the cards took ' + m.ready_ms + ' ms to be ready (more than 4 s)');
            for (const n of note) console.log('NOTE: ' + n);
            console.log(fail.length ? 'FAIL:\n  ' + fail.join('\n  ') : 'PASS: Task Manager ' + m.task_manager_mb + ' MB; ' + m.private_mb + ' MB private, ' + m.working_set_mb + ' MB working set');
            process.exit(fail.length ? 1 : 0);"
      - name: Build the Setup
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$iscc" ] || choco install innosetup --no-progress -y > /dev/null
          "$iscc" //Q "//DAppVersion=$v" installer/esther-native.iss
          ls -la installer/Output
      - name: Try the Setup (install, open twice, update, uninstall; your tasks untouched)
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          setup="$PWD/installer/Output/EstherNativeSetup-$v.exe"
          app="$(cygpath -u "$LOCALAPPDATA")/Programs/Esther native"
          data="$(cygpath -u "$APPDATA")/Esther"
          menu="$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/Esther.lnk"
          desk="$(cygpath -u "$USERPROFILE")/Desktop/Esther.lnk"
          run_key='HKCU\Software\Microsoft\Windows\CurrentVersion\Run'
          fail=()
          want() { if eval "$1"; then echo "ok: $2"; else echo "FAIL: $2"; fail+=("$2"); fi; }
          running() { tasklist //FI "IMAGENAME eq esther-native.exe" //NH | grep -ci esther-native || true; }
          # Someone's tasks, which nothing here may change.
          mkdir -p "$data"
          printf '%s' '{"version":1,"lists":[{"id":"general","name":"General","color":"#c8553a"}],"tasks":[{"id":"keep","title":"Keep me","listId":"general","done":false,"subtasks":[]}]}' > "$data/tasks.json"
          before=$(sha256sum < "$data/tasks.json")

          "$setup" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART '//TASKS=desktopicon,startup'
          sleep 6
          want '[ -f "$app/esther-native.exe" ]' "installed in %LOCALAPPDATA%\\Programs\\Esther native"
          want '[ -f "$app/unins000.exe" ]' "with its uninstaller"
          want '[ -f "$menu" ]' "a Start menu entry"
          want '[ -f "$desk" ]' "a desktop shortcut (asked for)"
          want 'reg query "$run_key" //v "Esther native" > /dev/null 2>&1' "starts with Windows (asked for)"
          want 'reg query "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{6F2C1D7A-4B8E-4E59-9C3A-7E1B5D0A2F64}_is1" > /dev/null 2>&1' "listed in Installed apps"
          want '[ "$(running)" = 1 ]' "Esther opened after installing"
          "$app/esther-native.exe" &
          sleep 4
          want '[ "$(running)" = 1 ]' "opening it again shows the same Esther (no second one)"

          # The updater, from the installed copy, with a release that has a newer Setup (this one, as 99.0.0).
          sha=$(sha256sum "$setup" | cut -c1-64)
          printf '{"assets":[{"name":"EstherNativeSetup-99.0.0.exe","digest":"sha256:%s","browser_download_url":"file:///%s"}]}' "$sha" "$(cygpath -m "$setup")" > feed.json
          got=$(ESTHER_UPDATE_FEED="file:///$(cygpath -m "$PWD/feed.json")" "$app/esther-native.exe" --check-update || true)
          echo "update check: $got"
          want '[[ "$got" == "ready 99.0.0 "* ]]' "the updater finds, downloads and checks a newer Setup"
          printf '{"assets":[{"name":"EstherNativeSetup-99.0.0.exe","digest":"sha256:%s","browser_download_url":"file:///%s"}]}' "0000${sha:4}" "$(cygpath -m "$setup")" > feed.json
          got=$(ESTHER_UPDATE_FEED="file:///$(cygpath -m "$PWD/feed.json")" "$app/esther-native.exe" --check-update || true)
          echo "update check (tampered): $got"
          want '[[ "$got" == *"didn"*"match"* ]]' "the updater refuses a download that isn't what was published"

          # Uninstall (Esther still open): everything goes but your tasks.
          "$app/unins000.exe" //VERYSILENT //SUPPRESSMSGBOXES
          for i in $(seq 1 30); do [ -f "$app/esther-native.exe" ] || break; sleep 1; done
          sleep 2
          want '[ ! -f "$app/esther-native.exe" ]' "uninstalling removes Esther"
          want '[ ! -f "$menu" ] && [ ! -f "$desk" ]' "and its shortcuts"
          want '! reg query "$run_key" //v "Esther native" > /dev/null 2>&1' "and starting with Windows"
          want '[ "$(running)" = 0 ]' "and closes it"
          want '[ "$(sha256sum < "$data/tasks.json")" = "$before" ]' "your tasks are exactly as they were"
          if [ ${#fail[@]} -gt 0 ]; then printf 'FAIL: %s\n' "${fail[@]}"; exit 1; fi
          echo "PASS: the Setup installs, updates and uninstalls, and your tasks are untouched"
      - name: Keep the test's pictures (also when it fails)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete esther-native-test --yes --cleanup-tag || true
          files=$(ls smoke/*.png smoke/memory.json smoke/esther-native-log.txt 2>/dev/null || true)
          [ -n "$files" ] && gh release create esther-native-test $files \
            --target "$GITHUB_SHA" --prerelease --title "Esther native: the last test run's pictures" \
            --notes "What the Windows test machine saw on its last run (for checking; not a download)." || true
      - name: Publish to the "Esther native" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (esther-tasks.exe: the same program under the one-card prototype's name, which the Esther installer
          # build picks up for its "native preview" shortcut.)
          # The download carries its version in its name (esther-native-0.3.0.exe), as the program does inside.
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cp target/release/esther-native.exe "smoke/esther-native-$v.exe"
          cp target/release/esther-native.exe smoke/esther-tasks.exe
          gh release delete esther-native --yes --cleanup-tag || true
          gh release create esther-native "installer/Output/EstherNativeSetup-$v.exe" "smoke/esther-native-$v.exe" smoke/esther-tasks.exe smoke/*.png smoke/memory.json \
            --target "$GITHUB_SHA" --prerelease \
            --title "Esther native $v (preview)" \
            --notes "Esther's header, calendar, This week and Tasks cards, and Settings, as one native Windows program (Rust + Slint), each card its own window on the desktop. It shares tasks with Esther through %APPDATA%\\Esther\\tasks.json (Esther 2.2 or later writes that file). Install it with EstherNativeSetup-$v.exe (for you only, no administrator needed; it updates itself from then on, and uninstalling leaves your tasks), or just run esther-native-$v.exe without installing (that copy doesn't update itself). Ctrl+Alt+E or the tray icon shows and hides it; the gear on the header opens Settings; Quit is in the tray menu."
