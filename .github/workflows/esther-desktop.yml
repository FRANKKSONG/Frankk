# Builds the Esther desktop app for Windows and puts the installer on the "Esther desktop" release.
name: Esther desktop (Windows)

on:
  push:
    branches: [claude/new-session-ynjv6z]
    paths: ['frankk-app/**', '.github/workflows/esther-desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esther-desktop
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: frankk-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frankk-app/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build the installer and the portable app
        run: npm run build:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Esther-windows
          path: |
            frankk-app/release/*.exe
            frankk-app/release/latest.yml
            frankk-app/release/*.blockmap
          if-no-files-found: error
      - name: Publish to the "Esther desktop" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release delete esther-desktop --yes --cleanup-tag || true
          # latest.yml tells installed copies of Esther that a new version is here (they update themselves).
          test -f release/latest.yml
          gh release create esther-desktop release/*.exe release/latest.yml release/*.blockmap \
            --target "$GITHUB_SHA" --prerelease \
            --title "Esther desktop $version" \
            --notes "Esther $version for Windows. Install once with Esther-Setup-$version.exe (no admin needed); after that Esther updates itself. Esther-$version-portable.exe runs without installing but does not update itself. Ctrl+Alt+E shows and hides it."
